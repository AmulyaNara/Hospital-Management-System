<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Diagnosis</title>

    <link rel="stylesheet" href="/static/css/dashboard.css">

    <style>
        body{
            background:#f5f7fb;
            font-family:Inter,sans-serif;
        }

        .container{
            max-width:700px;
            margin:40px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        h2{
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
        }

        textarea{
            resize:vertical;
            min-height:90px;
        }

        .buttons{
            display:flex;
            gap:10px;
            margin-top:20px;
        }

        button{
            padding:12px 22px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .save{
            background:#0f766e;
            color:white;
        }

        .cancel{
            background:#ddd;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Add Diagnosis</h2>

<form id="diagnosisForm">

<div class="form-group">
<label>Visit ID</label>
<input type="number" id="visit_id" required>
</div>

<div class="form-group">
<label>Patient Name</label>
<input type="text" id="patient_name" required>
</div>

<div class="form-group">
<label>Patient Code</label>
<input type="text" id="patient_code" required>
</div>

<div class="form-group">
<label>Disease</label>
<input type="text" id="disease" required>
</div>

<div class="form-group">
<label>Symptoms</label>
<textarea id="symptoms"></textarea>
</div>

<div class="form-group">
<label>Doctor Notes</label>
<textarea id="doctor_notes"></textarea>
</div>

<div class="form-group">
<label>Severity</label>

<select id="severity">
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

</div>

<div class="form-group">

<label>Status</label>

<select id="diagnosis_status">

<option>Active</option>
<option>Completed</option>

</select>

</div>

<div class="form-group">

<label>ICD Code</label>

<input type="text" id="icd_code">

</div>

<div class="buttons">

<button class="save" type="submit">

Save Diagnosis

</button>

<button
class="cancel"
type="button"
onclick="history.back()">

Cancel

</button>

</div>

</form>

</div>

<script>

document.getElementById("diagnosisForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const token=localStorage.getItem("access_token");

const response=await fetch("/diagnosis",{

method:"POST",

headers:{

"Content-Type":"application/json",

Authorization:`Bearer ${token}`

},

body:JSON.stringify({

visit_id:Number(document.getElementById("visit_id").value),

patient_name:document.getElementById("patient_name").value,

patient_code:document.getElementById("patient_code").value,

disease:document.getElementById("disease").value,

symptoms:document.getElementById("symptoms").value,

doctor_notes:document.getElementById("doctor_notes").value,

severity:document.getElementById("severity").value,

diagnosis_status:document.getElementById("diagnosis_status").value,

icd_code:document.getElementById("icd_code").value

})

});

const result=await response.json();

alert(result.message || "Diagnosis Added Successfully");

window.location.href="/admin-diagnosis";

});

</script>

</body>
</html>
