<!DOCTYPE html>
<html>

<head>
    <title>Book Appointment</title>
    
    <link rel="stylesheet"
          href="/static/css/book_appointment.css">

          </head>

<body>

<div class="appointment-container">

    <h1>Book Appointment</h1>

    <form id="appointmentForm">
        
        <div class="form-group">
    <label>Patient Name</label>
    <input type="text" id="patient_name" readonly>
</div>

<div class="form-group">
    <label>Patient ID</label>
    <input type="text" id="patient_id" readonly>
</div>

<div class="form-group">
    <label>Phone Number</label>
    <input type="text" id="phone" readonly>
</div>
    
        <div class="form-group">
            <label>Select Doctor</label>
            <select id="doctor">

    <option value="1">Dr. Ravi Kumar</option>

    <option value="2">Dr. Priya</option>

    <option value="3">Dr. Kiran</option>

    <option value="4">Dr. Anjali</option>

    <option value="5">Dr. Suresh</option>

    <option value="7">Dr. Arjun</option>

    <option value="8">Dr. Mohan</option>

    <option value="11">Dr. Naveen</option>

    <option value="12">Dr. Vasu</option>

    <option value="16">Dr. Asha</option>

    <option value="17">Dr. Ramu</option>

</select>
        </div>

        <div class="form-group">
            <label>Appointment Date</label>
            <input type="date" id="appointment_date">
        </div>

        

        <div class="form-group">
            <label>Reason For Visit</label>
            <textarea id="reason"></textarea>
        </div>

        <div class="form-group">
            <label>Priority</label>
            <select id="priority">
                <option>Normal</option>
                <option>Urgent</option>
                <option>Emergency</option>
            </select>
        </div>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</div>

<script src="/static/js/book_appointment.js"></script>

</body>
</html>
